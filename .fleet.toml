# .fleet.toml — this repo's card on the fleet architecture map.
# fleet-config's /system-map aggregates every repo's .fleet.toml. Keep current:
# update in the same PR as any material change (layer, port, role, one-line
# description, exposed services). Schema: fleet-config/architecture/README.md.
layer       = "working-pipe"
icon        = "💳"
description = "Stripe payments → quarterly reports."
tag         = ["→", "Stripe"]
shape       = "streamlit"
# logs/ keeps a tracked .gitkeep so the runtime log folder exists in a fresh clone
# (src/logger.py also creates it on first use); its contents are git-ignored.
extra_roots = ["logs"]

# Vendored byte-for-byte from project-scaffolding. sha = the source repo commit
# the copy was taken from; /propagate-vendored hash-verifies + bumps.
[vendored]
docs_ratchet = { src = "scripts/docs_ratchet.py", sha = "f9300a05540313bb26f442e1daa491c9308541d2", dest = "scripts/docs_ratchet.py" }
dead_code_ratchet = { src = "scripts/dead_code_ratchet.py", sha = "0eb0da42298e391fc614b3fe550bd6cf2d07c693", dest = "scripts/dead_code_ratchet.py" }
doc_refs_ratchet = { src = "scripts/doc_refs_ratchet.py", sha = "23dbefa46635c952d3c871bda4e80b740e7f2859", dest = "scripts/doc_refs_ratchet.py" }
instruction_ratchet = { src = "scripts/instruction_ratchet.py", sha = "60fdd0350f18d28838428b2e773f7868f6381fbf", dest = "scripts/instruction_ratchet.py" }
structure_ratchet = { src = "scripts/structure_ratchet.py", sha = "84d2b12ab416551762e4a615e4a706df91cea69f", dest = "scripts/structure_ratchet.py" }

# [docs_ratchet] -- the scaffold's docs ratchet. The gate (scripts/verify-before-ship.ps1)
# runs scripts/docs_ratchet.py through scripts/docs_ratchet_gate.py, which fails when
# README.md grows past 40 KiB or when README.md / docs/**/*.md gains a history marker
# (issue reference, dated or changelog heading) beyond .docs-ratchet-baseline.json. A
# check that cannot run (exit 3) is NOT CONFIRMED and fails, never a pass. Mechanism +
# limits: project-scaffolding docs/docs-ratchet.md.
[docs_ratchet]
enabled  = true
baseline = ".docs-ratchet-baseline.json"

# [structure_ratchet] -- the scaffold's baseline-and-ratchet layout stage. The gate
# (scripts/verify-before-ship.ps1) runs scripts/structure_ratchet.py, which fails when
# a new file passes 1,000 lines, a new function 100 lines or a flat directory 40
# modules, when a baselined offender grows past its size in
# .structure-ratchet-baseline.json, when src/ imports app/, and when the root folders
# do not match `shape` plus `extra_roots`. Existing offenders are baselined at today's
# size, never excluded. Exit 3 (git unusable, an unparseable file, an unknown shape)
# is NOT CONFIRMED; the gate stage fails on any non-zero exit. Procedure:
# project-scaffolding docs/structure-ratchet.md.
[structure_ratchet]
enabled  = true
baseline = ".structure-ratchet-baseline.json"

# [instruction_ratchet] -- the scaffold's prompt-audit lint over the instruction files
# (CLAUDE.md, AGENTS.md, .claude/rules, every SKILL.md and the docs a skill links to).
# The gate (scripts/verify-before-ship.ps1) runs scripts/instruction_ratchet.py, which
# fails when a rule's hit count rises above .instruction-ratchet-baseline.json or a file
# passes its size cap. Existing hits are baselined, never excluded. Exit 3 (git unusable,
# an unreadable file, an unclosed fence, an unreadable skill description) is NOT
# CONFIRMED; the gate stage fails on any non-zero exit. Procedure: project-scaffolding
# docs/instruction-ratchet.md.
[instruction_ratchet]
enabled  = true
baseline = ".instruction-ratchet-baseline.json"

# [doc_refs_ratchet] -- the scaffold's stale-reference ratchet. The gate
# (scripts/verify-before-ship.ps1) runs scripts/doc_refs_ratchet.py, which fails when
# README.md, CLAUDE.md or docs/**/*.md names a repo path, `python -m` module, relative
# link or loopback port that does not exist, beyond .doc-refs-ratchet-baseline.json.
# allow_refs lists what the docs name on purpose: the local-llm-hub port, and
# data/backups, which `close_quarter.py relink --apply` creates beside the database at
# run time. Exit 3 (git unusable, an unreadable file) is NOT CONFIRMED; the gate stage
# fails on any non-zero exit. Procedure: project-scaffolding docs/doc-refs-ratchet.md.
[doc_refs_ratchet]
enabled    = true
baseline   = ".doc-refs-ratchet-baseline.json"
allow_refs = [":8000", "data/backups"]

# [dead_code_ratchet] -- the scaffold's unreferenced-definition ratchet. The gate
# (scripts/verify-before-ship.ps1) runs scripts/dead_code_ratchet.py, which fails when a
# new Python function, class or method appears that nothing in the repo refers to,
# beyond .dead-code-ratchet-baseline.json. Existing ones are baselined, never excluded.
# Exit 3 (git unusable, an unparseable file) is NOT CONFIRMED; the gate stage fails on
# any non-zero exit. Procedure: project-scaffolding docs/dead-code-ratchet.md.
[dead_code_ratchet]
enabled  = true
baseline = ".dead-code-ratchet-baseline.json"
