# .fleet.toml — this repo's card on the fleet architecture map.
# fleet-config's /system-map aggregates every repo's .fleet.toml. Keep current:
# update in the same PR as any material change (layer, port, role, one-line
# description, exposed services). Schema: fleet-config/architecture/README.md.
layer       = "working-pipe"
icon        = "💳"
description = "Stripe payments → quarterly reports."
tag         = ["→", "Stripe"]
shape       = "streamlit"
# logs/ keeps a tracked .gitkeep so the runtime log folder exists in a fresh clone
# (src/logger.py also creates it on first use); its contents are git-ignored.
extra_roots = ["logs"]

# Vendored byte-for-byte from project-scaffolding. sha = the source repo commit
# the copy was taken from; /propagate-vendored hash-verifies + bumps.
[vendored]
docs_ratchet = { src = "scripts/docs_ratchet.py", sha = "baac1ed97388a3545bd1e52544821ec20f1dc77a", dest = "scripts/docs_ratchet.py" }
dead_code_ratchet = { src = "scripts/dead_code_ratchet.py", sha = "baac1ed97388a3545bd1e52544821ec20f1dc77a", dest = "scripts/dead_code_ratchet.py" }
doc_refs_ratchet = { src = "scripts/doc_refs_ratchet.py", sha = "baac1ed97388a3545bd1e52544821ec20f1dc77a", dest = "scripts/doc_refs_ratchet.py" }
instruction_ratchet = { src = "scripts/instruction_ratchet.py", sha = "baac1ed97388a3545bd1e52544821ec20f1dc77a", dest = "scripts/instruction_ratchet.py" }
structure_ratchet = { src = "scripts/structure_ratchet.py", sha = "713b1d1e36989440679ec4e415ff149b14d96c81", dest = "scripts/structure_ratchet.py" }
structure_layout = { src = "scripts/structure_layout.py", sha = "713b1d1e36989440679ec4e415ff149b14d96c81", dest = "scripts/structure_layout.py" }
box_lock_gate = { src = "scripts/box_lock_gate.ps1", sha = "98cdb1b7727d12a5c233580478e6fae40d98e6f3", dest = "scripts/box_lock_gate.ps1" }
static_ratchet = { src = "scripts/static_ratchet.py", sha = "537cf3931b57e7453ed251850c0dbeac042b03bf", dest = "scripts/static_ratchet.py" }
comment_ratchet = { src = "scripts/comment_ratchet.py", sha = "baac1ed97388a3545bd1e52544821ec20f1dc77a", dest = "scripts/comment_ratchet.py" }
conventions_ratchet = { src = "scripts/conventions_ratchet.py", sha = "baac1ed97388a3545bd1e52544821ec20f1dc77a", dest = "scripts/conventions_ratchet.py" }

# [docs_ratchet] -- the scaffold's docs ratchet. The gate (scripts/verify-before-ship.ps1)
# runs scripts/docs_ratchet.py through scripts/docs_ratchet_gate.py, which fails when
# README.md grows past 40 KiB or when README.md / docs/**/*.md gains a history marker
# (issue reference, dated or changelog heading) beyond .docs-ratchet-baseline.json. A
# check that cannot run (exit 3) is NOT CONFIRMED and fails, never a pass. Mechanism +
# limits: project-scaffolding docs/docs-ratchet.md.
[docs_ratchet]
enabled  = true
baseline = ".docs-ratchet-baseline.json"

# [structure_ratchet] -- the scaffold's baseline-and-ratchet layout stage. The gate
# (scripts/verify-before-ship.ps1) runs scripts/structure_ratchet.py, which fails when
# a new file passes 1,000 lines, a new function 100 lines or a flat directory 40
# modules, when a baselined offender grows past its size in
# .structure-ratchet-baseline.json, when src/ imports app/, and when the root folders
# do not match `shape` plus `extra_roots`. Existing offenders are baselined at today's
# size, never excluded. Exit 3 (git unusable, an unparseable file, an unknown shape)
# is NOT CONFIRMED; the gate stage fails on any non-zero exit. Procedure:
# project-scaffolding docs/structure-ratchet.md.
[structure_ratchet]
enabled  = true
baseline = ".structure-ratchet-baseline.json"

# [instruction_ratchet] -- the scaffold's prompt-audit lint over the instruction files
# (CLAUDE.md, AGENTS.md, .claude/rules, every SKILL.md and the docs a skill links to).
# The gate (scripts/verify-before-ship.ps1) runs scripts/instruction_ratchet.py, which
# fails when a rule's hit count rises above .instruction-ratchet-baseline.json or a file
# passes its size cap. Existing hits are baselined, never excluded. Exit 3 (git unusable,
# an unreadable file, an unclosed fence, an unreadable skill description) is NOT
# CONFIRMED; the gate stage fails on any non-zero exit. Procedure: project-scaffolding
# docs/instruction-ratchet.md.
[instruction_ratchet]
enabled  = true
baseline = ".instruction-ratchet-baseline.json"

# [doc_refs_ratchet] -- the scaffold's stale-reference ratchet. The gate
# (scripts/verify-before-ship.ps1) runs scripts/doc_refs_ratchet.py, which fails when
# README.md, CLAUDE.md or docs/**/*.md names a repo path, `python -m` module, relative
# link or loopback port that does not exist, beyond .doc-refs-ratchet-baseline.json.
# allow_refs lists what the docs name on purpose: the local-llm-hub port, and
# data/backups, which `close_quarter.py relink --apply` creates beside the database at
# run time. Exit 3 (git unusable, an unreadable file) is NOT CONFIRMED; the gate stage
# fails on any non-zero exit. Procedure: project-scaffolding docs/doc-refs-ratchet.md.
[doc_refs_ratchet]
enabled    = true
baseline   = ".doc-refs-ratchet-baseline.json"
allow_refs = [":8000", "data/backups"]

# [dead_code_ratchet] -- the scaffold's unreferenced-definition ratchet. The gate
# (scripts/verify-before-ship.ps1) runs scripts/dead_code_ratchet.py, which fails when a
# new Python function, class or method appears that nothing in the repo refers to,
# beyond .dead-code-ratchet-baseline.json. Existing ones are baselined, never excluded.
# Exit 3 (git unusable, an unparseable file) is NOT CONFIRMED; the gate stage fails on
# any non-zero exit. Procedure: project-scaffolding docs/dead-code-ratchet.md.
[dead_code_ratchet]
enabled  = true
baseline = ".dead-code-ratchet-baseline.json"

# [static_ratchet] -- the scaffold's duplicate-block, unused-name and bug/security-pattern
# ratchet. The gate (scripts/verify-before-ship.ps1) runs scripts/static_ratchet.py, which
# fails on a duplicate block (jscpd, Python + JS), an unused import or variable (ruff
# F401/F841) or a curated ruff B/S hit that is not in .static-ratchet-baseline.json.
# Vendored destinations are left out automatically. Needs Node (npx) and ruff in the
# gate venv; exit 3 (a detector could not run) is NOT CONFIRMED; the gate stage fails
# on any non-zero exit. Procedure: project-scaffolding docs/static-ratchet.md.
[static_ratchet]
enabled  = true
baseline = ".static-ratchet-baseline.json"

# [comment_ratchet] -- the scaffold's history-in-comments ratchet. The gate
# (scripts/verify-before-ship.ps1) runs scripts/comment_ratchet.py, which counts #NNN
# issue references inside product-code comments (py, js, css, ps1) per file and fails
# when a file's count rises above .comment-ratchet-baseline.json. Tests and vendored
# destinations are left out by the script. Exit 3 (git unusable, a file that cannot be
# scanned) is NOT CONFIRMED; the gate stage fails on any non-zero exit. Procedure:
# project-scaffolding docs/comment-ratchet.md.
[comment_ratchet]
enabled  = true
baseline = ".comment-ratchet-baseline.json"

# [docstring_ratchet] -- repo-local, NOT vendored (there is no project-scaffolding
# source for it). The gate (scripts/verify-before-ship.ps1) runs
# scripts/docstring_ratchet.py, which counts #NNN issue references inside Python
# module/class/function docstrings -- the vendored comment ratchet's own documented
# blind spot ("Docstrings ... are out of scope") -- per tracked file, and fails when a
# file's count rises above .docstring-ratchet-baseline.json. Tests and vendored
# destinations are left out by the script. Exit 3 (git unusable, a file that cannot be
# read or parsed) is NOT CONFIRMED; the gate stage fails on any non-zero exit.
[docstring_ratchet]
enabled  = true
baseline = ".docstring-ratchet-baseline.json"

# [conventions_ratchet] -- the scaffold's fleet-convention ratchet. The gate
# (scripts/verify-before-ship.ps1) runs scripts/conventions_ratchet.py, which counts
# per file the hits of each enabled rule (stdlib ast) and fails when a count rises above
# .conventions-ratchet-baseline.json. Enabled rules: no-window (Windows-hosted app that
# spawns subprocesses), logging-not-print (print() in app/ and src/ library code) and
# no-drive-path (no hardcoded drive paths). secret-compare and git-wrapper stay off:
# the repo has no constant-time-compare or git-spawn helper for them to route through.
# Exit 3 (git unusable, a file that cannot be parsed) is NOT CONFIRMED; the gate stage
# fails on any non-zero exit. Procedure: project-scaffolding docs/conventions-ratchet.md.
[conventions_ratchet]
enabled  = true
baseline = ".conventions-ratchet-baseline.json"
rules    = ["no-window", "logging-not-print", "no-drive-path"]
